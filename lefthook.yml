pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck

commit-msg:
  jobs:
    - name: no-ai-coauthor
      run: node scripts/check-commit-msg.mjs {1}
